[project]
name = "timestral-local"
version = "0.1.0"
description = "Local Timestral inference environment"
requires-python = ">=3.10,<3.13"
dependencies = [
    "timestral",
    "torch==2.14.1",
]

[tool.uv]
package = false

[tool.uv.sources]
timestral = { git = "https://github.com/mistralai/timestral.git", rev = "a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff" }
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
]
